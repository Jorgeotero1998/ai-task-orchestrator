services:
  db:
    image: postgres:16
    container_name: ai-task-db
    environment:
      POSTGRES_DB: ai_task_orchestrator
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    # Uncomment if you need to connect from host tools:
    # ports:
    #   - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_task_orchestrator"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: ai-task-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/ai_task_orchestrator
      JWT_SECRET: ${JWT_SECRET:-change-me}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      CORS_ORIGINS_CSV: ${CORS_ORIGINS_CSV:-http://localhost:3000}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build: ./frontend
    container_name: ai-task-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
      API_BASE_URL_INTERNAL: http://backend:8000
    stdin_open: true
    tty: true
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db_data:
